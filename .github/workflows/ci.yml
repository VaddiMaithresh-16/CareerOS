name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          APP_ENV: development
        run: pytest -v

      - name: Check for stray docker/uvicorn references
        run: |
          if grep -rn "docker-compose\|Dockerfile" --include="*.py" .; then
            echo "found docker references in python source"; exit 1
          fi
          exit 0
