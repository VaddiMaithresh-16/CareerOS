[project]
name = "careeros"
version = "0.2.0"
description = "CareerOS — job discovery, matching, and verification pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "granian>=1.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pymysql>=1.1",
    "httpx>=0.27",
    "gradio>=4.40",
    "python-dotenv>=1.0",
    "qdrant-client>=1.10",
    "scikit-learn>=1.5",
    "langgraph>=1.0",
    "langchain-core>=0.3",
    "langgraph-checkpoint-mysql[aiomysql]>=2.0",
    "slowapi>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
careeros-api = "run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["run"]
packages = ["app", "app.services"]
